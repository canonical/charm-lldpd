[project]
name = "lldpd"
version = "0.0"
requires-python = ">=3.8"
dependencies = ["ops>=1.4.0"]

[tool.ruff]
target-version = "py38"
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "C", "N", "R", "D", "I001"]
ignore = ["E501", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104"]
